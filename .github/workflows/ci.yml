name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            artifact-name: ubuntu-24.04
          - name: macOS 15 (Apple Silicon)
            os: macos-15
            artifact-name: macos-15-arm64
          - name: Windows Server 2025
            os: windows-2025
            artifact-name: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            xauth \
            xvfb

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --preset release

      - name: Upload Killeroo visual regression output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: killeroo-${{ matrix.artifact-name }}
          path: _build/release/killeroo.0001.tif
          if-no-files-found: ignore
          retention-days: 14
